name: AAF v3 - text runs (postmortems)

on:
  push:
    branches: [text-evidence-pilot]
    paths: ["external_validation/aaf_v3/text_v3.py", "external_validation/aaf_v3/run_text_v3.py", ".github/workflows/aaf-v3-text.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_REASONING_EFFORT: none
      CAT_REASONING_EFFORT: low
      A_REASONING_EFFORT: medium
      SPLIT: dev
      ARMS: "L V3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml numpy pandas scipy openai requests beautifulsoup4
      - name: Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m external_validation.aaf_v3.run_text_v3 --split "$SPLIT" --arms $ARMS --repeats 5
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f external_validation/aaf_v3/results
          git commit -m "AAF v3 text run (${SPLIT}): run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*7)); done
