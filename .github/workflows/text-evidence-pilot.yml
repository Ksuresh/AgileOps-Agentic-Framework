name: Text-evidence development pilot

# Development pilot; results are not confirmatory and are never pooled with the
# frozen 32/16-case studies. Runs on pushes to the pilot branch (or manually) and
# commits its results back to that branch. Commits made with GITHUB_TOKEN do not
# trigger new workflow runs, so there is no loop.
on:
  push:
    branches: [text-evidence-pilot]
    paths: ["text_evidence_pilot/**", "tests/test_text_evidence_pilot.py", ".github/workflows/text-evidence-pilot.yml"]
  workflow_dispatch:
    inputs:
      repeats: {description: "LLM runs per case", default: "5"}
      model: {description: "OpenAI model", default: "gpt-5.6-luna"}
      reasoning_effort: {description: "Reasoning effort", default: "none"}

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPEATS: ${{ inputs.repeats || '5' }}
      OPENAI_MODEL: ${{ inputs.model || 'gpt-5.6-luna' }}
      OPENAI_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyyaml numpy pandas scipy openai pytest
      - name: Integrity tests (no API calls)
        run: python -m pytest -q tests/test_text_evidence_pilot.py
      - name: Pilot with LLM reader
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p text_evidence_pilot/results
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not set for this repository" | tee text_evidence_pilot/results/STATUS.txt
            exit 1
          fi
          python -m text_evidence_pilot.run_pilot --repeats "$REPEATS" 2>&1 | tee text_evidence_pilot/results/run_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit results back to the pilot branch
        if: always()
        run: |
          echo "run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} conclusion_of_pilot_step=${{ job.status }}" >> text_evidence_pilot/results/RUNS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f text_evidence_pilot/results
          git commit -m "pilot results: run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-evidence-pilot-${{ github.run_id }}
          path: text_evidence_pilot/results/
