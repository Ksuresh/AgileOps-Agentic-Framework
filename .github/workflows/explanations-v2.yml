name: Explanation study A1 - plain-language prompt on fresh records

on:
  push:
    branches: [text-evidence-pilot]
    paths: ["external_validation/explanations/run_explanations_v2.py", ".github/workflows/explanations-v2.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENAI_MODEL: gpt-5.6-luna
      JUDGE_EFFORT: high
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml numpy pandas pyarrow scipy openai huggingface_hub
      - name: Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p external_validation/explanations/results
          python -m external_validation.explanations.run_explanations_v2 2>&1 | tail -c 30000 > external_validation/explanations/results/run_log_v2_${GITHUB_RUN_ID}.txt; exit ${PIPESTATUS[0]}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f external_validation/explanations/results
          git commit -m "Explanation study A1 results: run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*7)); done
