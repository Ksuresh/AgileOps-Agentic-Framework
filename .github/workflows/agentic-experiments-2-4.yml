name: AAF Confirmatory Agentic Experiments 2-4

on:
  workflow_dispatch:

jobs:
  confirmatory-agentic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_REASONING_EFFORT: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pre-confirmatory protocol tests
        run: |
          python -m pytest -q \
            tests/test_evidence_schema.py \
            tests/test_decision_gate.py \
            tests/test_aaf_v2_arbitration.py \
            tests/test_agentic_experiment_protocol.py
      - name: Verify API secret is configured
        run: |
          python - <<'PY'
          import os
          if not os.getenv('OPENAI_API_KEY'):
              raise SystemExit('OPENAI_API_KEY repository secret is not available to this workflow')
          print('OPENAI_API_KEY is configured (value not displayed).')
          PY
      - name: Run frozen Experiments 2-4
        run: python -m agentic_experiments.run_experiments_2_4
      - name: Upload confirmatory outputs
        uses: actions/upload-artifact@v4
        with:
          name: aaf-agentic-experiments-2-4-gpt-5-6-luna
          path: paper_results/agentic_experiments_2_4/
          if-no-files-found: error
          retention-days: 90
