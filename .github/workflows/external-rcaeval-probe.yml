name: External RCAEval Schema Probe

on:
  push:
    branches:
      - experiment/external-rcaeval-validation
    paths:
      - 'external_validation/rcaeval/**'
      - '.github/workflows/external-rcaeval-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: pip install -r external_validation/rcaeval/requirements.txt
      - name: Probe RCAEval RE2-TT schema
        run: python external_validation/rcaeval/probe_schema.py
      - name: Upload schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-rcaeval-schema-probe
          path: paper_results/external_rcaeval/generated/probe/
          if-no-files-found: error
