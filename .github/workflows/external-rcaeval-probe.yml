name: External RCAEval Schema Probe

on:
  push:
    branches:
      - experiment/external-rcaeval-validation
    paths:
      - 'experiments/probe_rcaeval_schema.py'
      - '.github/workflows/external-rcaeval-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: pip install pandas pyarrow huggingface_hub
      - name: Probe RCAEval RE2-TT schema
        run: python experiments/probe_rcaeval_schema.py
      - name: Upload schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-rcaeval-schema-probe
          path: results_external_rcaeval_probe/
          if-no-files-found: error
