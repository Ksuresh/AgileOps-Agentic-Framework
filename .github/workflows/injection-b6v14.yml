name: Study 11c - prompt injection against the v1.4-policy LLM decider (GPT-5.6 Luna)

on:
  push:
    branches: [text-evidence-pilot]
    paths: ["containment_study/INJECT_RUN"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Config
        run: |
          get() { grep -E "^$1=" containment_study/INJECT_RUN | cut -d= -f2-; }
          echo "MAX_CALLS=$(get MAX_CALLS)" >> $GITHUB_ENV; echo "MAX_TOKENS=$(get MAX_TOKENS)" >> $GITHUB_ENV
          echo "ARMS=$(get ARMS)" >> $GITHUB_ENV; echo "WORKERS=$(get WORKERS)" >> $GITHUB_ENV
      - name: Run
        timeout-minutes: 280
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p containment_study/results/injection_b6v14
          python containment_study/inject_b6v14.py 2>&1 | tail -c 60000 >> containment_study/results/injection_b6v14/run_log_${GITHUB_RUN_ID}.txt; exit ${PIPESTATUS[0]}
      - name: Analyze
        if: always()
        run: python containment_study/analyze_injection_b6v14.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f containment_study/results/injection_b6v14 containment_study/results/injection_b6v14_analysis.json || true
          git commit -m "Study 11c injection run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*9)); done
