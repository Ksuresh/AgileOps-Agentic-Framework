name: Sock Shop Runtime Pilot

on:
  push:
    branches:
      - revision/post-review-2026
  workflow_dispatch:

jobs:
  runtime-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      MYSQL_ROOT_PASSWORD: ""
    steps:
      - name: Checkout AAF
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml

      - name: Validate AAF before runtime experiment
        run: python -m pytest -q

      - name: Clone canonical Sock Shop deployment repository
        run: |
          git clone --depth 1 https://github.com/microservices-demo/microservices-demo.git /tmp/sock-shop
          echo "SOCK_COMPOSE=/tmp/sock-shop/deploy/docker-compose/docker-compose.yml" >> "$GITHUB_ENV"
          git -C /tmp/sock-shop rev-parse HEAD > runtime_validation/sock_shop_commit.txt

      - name: Start Sock Shop
        run: |
          docker compose -f "$SOCK_COMPOSE" pull
          docker compose -f "$SOCK_COMPOSE" up -d
          sleep 45
          docker compose -f "$SOCK_COMPOSE" ps -a

      - name: Collect healthy baseline repetitions
        run: |
          for rep in 1 2 3; do
            python runtime_validation/run_runtime_case.py RT-01 --repetition "$rep" --compose-file "$SOCK_COMPOSE" --settle-seconds 10 --execute
            sleep 5
          done

      - name: Run service-degradation repetitions
        run: |
          for rep in 1 2 3; do
            docker compose -f "$SOCK_COMPOSE" up -d catalogue
            sleep 10
            python runtime_validation/run_runtime_case.py RT-02 --repetition "$rep" --compose-file "$SOCK_COMPOSE" --settle-seconds 10 --restore-after --execute
            sleep 10
          done

      - name: Run resource-footprint repetitions
        run: |
          for rep in 1 2 3; do
            docker compose -f "$SOCK_COMPOSE" up -d --scale front-end=1
            sleep 10
            python runtime_validation/run_runtime_case.py RT-09 --repetition "$rep" --compose-file "$SOCK_COMPOSE" --settle-seconds 10 --execute
            docker compose -f "$SOCK_COMPOSE" up -d --scale front-end=1
            sleep 10
          done

      - name: Evaluate runtime artifacts against intervention oracles
        run: |
          python runtime_validation/evaluate_runtime_artifacts.py --cases RT-01,RT-02,RT-09 --repetitions 1,2,3 --out results_revision_runtime_pilot

      - name: Capture final runtime state
        if: always()
        run: |
          docker compose -f "$SOCK_COMPOSE" ps -a > runtime_validation/final_compose_ps.txt 2>&1 || true
          docker version > runtime_validation/docker_version.txt 2>&1 || true
          docker compose version > runtime_validation/docker_compose_version.txt 2>&1 || true

      - name: Upload runtime evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-sock-shop-runtime-pilot
          path: |
            runtime_validation/artifacts
            runtime_validation/run_metadata
            runtime_validation/sock_shop_commit.txt
            runtime_validation/final_compose_ps.txt
            runtime_validation/docker_version.txt
            runtime_validation/docker_compose_version.txt
            results_revision_runtime_pilot
