name: Reproducibility Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Verify frozen manifests are readable
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          manifests = [
              'runtime_validation/interventions.yaml',
              'runtime_validation/interventions_expanded_heldout.yaml',
              'runtime_validation/interventions_extended_validation.yaml',
              'runtime_validation/interventions_v2_prospective.yaml',
          ]
          for name in manifests:
              path = Path(name)
              assert path.exists(), name
              data = yaml.safe_load(path.read_text())
              assert data, name
              print('OK', name)
          PY
