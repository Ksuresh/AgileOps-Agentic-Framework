name: Online Boutique Frozen Second Benchmark

on:
  workflow_dispatch:

jobs:
  online-boutique:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      OB_COMMIT: b9a978db9e01f4ad3dca9494a22cb9edc17548fe
    steps:
      - name: Checkout AAF
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Record AAF decision-path hashes
        run: |
          {
            echo "cross_domain=$(git hash-object orchestrator/cross_domain.py)"
            echo "severity=$(git hash-object orchestrator/severity.py)"
            echo "utility=$(git hash-object orchestrator/utility.py)"
            echo "decision_baselines=$(git hash-object orchestrator/decision_baselines.py)"
          } > online_boutique_aaf_freeze.txt
      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create Kubernetes cluster
        run: |
          kind create cluster --name aaf-ob --wait 120s
          kubectl cluster-info
      - name: Clone pinned Online Boutique
        run: |
          git clone https://github.com/GoogleCloudPlatform/microservices-demo.git /tmp/online-boutique
          git -C /tmp/online-boutique checkout "$OB_COMMIT"
          test "$(git -C /tmp/online-boutique rev-parse HEAD)" = "$OB_COMMIT"
          git -C /tmp/online-boutique rev-parse HEAD > online_boutique_source_commit.txt
      - name: Deploy Online Boutique
        run: |
          kubectl apply -f /tmp/online-boutique/release/kubernetes-manifests.yaml
          kubectl wait --for=condition=available deployment --all --timeout=600s
          kubectl get deployments
          kubectl get pods -o wide
      - name: Start frontend port-forward
        run: |
          kubectl port-forward service/frontend 8080:80 > online_boutique_port_forward.log 2>&1 &
          echo $! > online_boutique_port_forward.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat online_boutique_port_forward.log
          exit 1
      - name: Run frozen OB-01 to OB-08
        run: |
          for i in $(seq -w 1 8); do
            python runtime_validation/run_online_boutique_case.py "OB-$i"
          done
      - name: Evaluate second benchmark
        run: python runtime_validation/evaluate_online_boutique.py
      - name: Capture environment
        if: always()
        run: |
          kubectl get pods -o wide > online_boutique_final_pods.txt 2>&1 || true
          kubectl get deployment frontend -o yaml > online_boutique_final_frontend.yaml 2>&1 || true
          kubectl version > online_boutique_kubectl_version.txt 2>&1 || true
          kind version > online_boutique_kind_version.txt 2>&1 || true
      - name: Upload Online Boutique evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaf-online-boutique-second-benchmark
          path: |
            results_online_boutique_runtime
            runtime_validation/interventions_online_boutique.yaml
            online_boutique_aaf_freeze.txt
            online_boutique_source_commit.txt
            online_boutique_port_forward.log
            online_boutique_final_pods.txt
            online_boutique_final_frontend.yaml
            online_boutique_kubectl_version.txt
            online_boutique_kind_version.txt
