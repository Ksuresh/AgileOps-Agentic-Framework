name: Online Boutique Frozen Second Benchmark - Harness Fix

on:
  push:
    branches:
      - experiment/aaf-second-benchmark-online-boutique-harnessfix
  workflow_dispatch:

jobs:
  online-boutique:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      OB_COMMIT: b9a978db9e01f4ad3dca9494a22cb9edc17548fe
    steps:
      - name: Checkout AAF
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml

      - name: Regression tests
        run: python -m pytest -q

      - name: Freeze-check AAF decision path
        run: |
          test "$(git hash-object orchestrator/cross_domain.py)" = "d2954dcd656c033120d3a23c2e38ca2ce06c60f0"
          test "$(git hash-object orchestrator/severity.py)" = "b8528927d2d1b78d1ae224aa86fa76c7ac65524e"
          test "$(git hash-object orchestrator/utility.py)" = "baff42d641b0ef09a7d45da8a4f6c7af7412b460"
          test "$(git hash-object orchestrator/decision_baselines.py)" = "44660ea13dcf6f57739fe36582cb3e3924b1b964"
          {
            echo "cross_domain=$(git hash-object orchestrator/cross_domain.py)"
            echo "severity=$(git hash-object orchestrator/severity.py)"
            echo "utility=$(git hash-object orchestrator/utility.py)"
            echo "decision_baselines=$(git hash-object orchestrator/decision_baselines.py)"
          } > online_boutique_aaf_freeze.txt

      - name: Freeze-check scenario manifest
        run: |
          sha256sum runtime_validation/interventions_online_boutique.yaml > online_boutique_manifest_sha256.txt
          cat runtime_validation/interventions_online_boutique.yaml

      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Create Kubernetes cluster
        run: |
          kind create cluster --name aaf-ob --wait 120s
          kubectl cluster-info

      - name: Clone pinned Online Boutique
        run: |
          git clone https://github.com/GoogleCloudPlatform/microservices-demo.git /tmp/online-boutique
          git -C /tmp/online-boutique checkout "$OB_COMMIT"
          test "$(git -C /tmp/online-boutique rev-parse HEAD)" = "$OB_COMMIT"
          git -C /tmp/online-boutique rev-parse HEAD > online_boutique_source_commit.txt

      - name: Deploy Online Boutique
        run: |
          kubectl apply -f /tmp/online-boutique/release/kubernetes-manifests.yaml
          kubectl wait --for=condition=available deployment --all --timeout=600s
          kubectl get deployments
          kubectl get pods -o wide

      - name: Expose stable frontend measurement endpoint
        run: |
          kubectl patch service frontend --type merge -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":8080,"nodePort":30080}]}}'
          NODE_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' aaf-ob-control-plane)"
          echo "OB_URL=http://${NODE_IP}:30080/" >> "$GITHUB_ENV"
          echo "node_ip=${NODE_IP}" > online_boutique_measurement_endpoint.txt
          echo "url=http://${NODE_IP}:30080/" >> online_boutique_measurement_endpoint.txt
          for i in $(seq 1 60); do
            if curl -fsS "http://${NODE_IP}:30080/" >/dev/null; then exit 0; fi
            sleep 2
          done
          kubectl get service frontend -o yaml
          kubectl get endpoints frontend -o yaml
          exit 1

      - name: OB-01 healthy control
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-01 --url "$OB_URL"

      - name: OB-02 frontend outage control
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-02 --url "$OB_URL"

      - name: Revalidate measurement endpoint after outage recovery
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
          curl -fsS "$OB_URL" >/dev/null

      - name: OB-03 resource-efficiency control
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-03 --url "$OB_URL"

      - name: OB-04 temporal restart burst
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-04 --url "$OB_URL"

      - name: OB-05 restart burst under workload
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-05 --url "$OB_URL"

      - name: OB-06 deployment-security condition
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-06 --url "$OB_URL"

      - name: OB-07 CPU-constrained reliability control
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-07 --url "$OB_URL"

      - name: OB-08 reliability-resource tradeoff
        run: python runtime_validation/run_online_boutique_case_nodeport.py OB-08 --url "$OB_URL"

      - name: Validate measurement path after all scenarios
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
          curl -fsS "$OB_URL" >/dev/null
          kubectl get service frontend -o wide
          kubectl get endpoints frontend -o wide

      - name: Evaluate second benchmark
        run: python runtime_validation/evaluate_online_boutique.py

      - name: Capture environment
        if: always()
        run: |
          kubectl get pods -o wide > online_boutique_final_pods.txt 2>&1 || true
          kubectl get deployment frontend -o yaml > online_boutique_final_frontend.yaml 2>&1 || true
          kubectl get service frontend -o yaml > online_boutique_final_frontend_service.yaml 2>&1 || true
          kubectl version > online_boutique_kubectl_version.txt 2>&1 || true
          kind version > online_boutique_kind_version.txt 2>&1 || true

      - name: Upload Online Boutique evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaf-online-boutique-second-benchmark-nodeport-final
          path: |
            results_online_boutique_runtime
            runtime_validation/interventions_online_boutique.yaml
            runtime_validation/run_online_boutique_case_nodeport.py
            online_boutique_aaf_freeze.txt
            online_boutique_manifest_sha256.txt
            online_boutique_source_commit.txt
            online_boutique_measurement_endpoint.txt
            online_boutique_final_pods.txt
            online_boutique_final_frontend.yaml
            online_boutique_final_frontend_service.yaml
            online_boutique_kubectl_version.txt
            online_boutique_kind_version.txt
