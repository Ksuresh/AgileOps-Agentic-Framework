name: AAF v3 - holdout metadata probe

on:
  push:
    branches: [text-evidence-pilot]
    paths: ["external_validation/aaf_v3/probe_holdout_metadata.py", ".github/workflows/aaf-v3-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow huggingface_hub
      - run: python external_validation/aaf_v3/probe_holdout_metadata.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f external_validation/aaf_v3/probe_report
          git commit -m "AAF v3 holdout metadata probe: run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
