name: Reviewer D1 and D2 Baseline Validation

on:
  push:
    branches:
      - review/ieee-access-baseline-validation
    paths:
      - 'reviewer_revision/**'
      - '.github/workflows/reviewer-d1-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate D1 retrieval contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest reviewer_revision.test_d1_contract reviewer_revision.test_d2_contract -v
      - name: Execute 48-case D2 comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m reviewer_revision.run_d2
      - name: Execute 48-case D1 evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m reviewer_revision.run_d1
      - name: Upload D2 exploratory outputs
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-d2-48case-${{ github.run_id }}
          path: reviewer_revision/results/d2_48case_exploratory/
          if-no-files-found: error
      - name: Upload exploratory outputs
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-d1-48case-${{ github.run_id }}
          path: reviewer_revision/results/d1_48case_exploratory/
          if-no-files-found: error
