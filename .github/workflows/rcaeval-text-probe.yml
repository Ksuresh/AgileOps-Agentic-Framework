name: RCAEval RE2 schema probe (text-evidence study design)

# Read-only probe; commits a small schema report (no full telemetry) back to the branch.
on:
  push:
    branches: [text-evidence-pilot]
    paths: ["external_validation/rcaeval_text/probe_re2*.py", ".github/workflows/rcaeval-text-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow huggingface_hub
      - name: Probe
        run: python external_validation/rcaeval_text/probe_re2_signal.py 2>&1 | tee probe_log.txt
      - name: Commit probe report
        if: always()
        run: |
          mkdir -p external_validation/rcaeval_text/probe_report
          cp probe_log.txt external_validation/rcaeval_text/probe_report/probe_signal_log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f external_validation/rcaeval_text/probe_report
          git commit -m "RCAEval RE2 probe report: run ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
