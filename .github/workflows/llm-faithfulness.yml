name: AAF Bounded LLM Faithfulness Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/llm-faithfulness-packaging
    paths:
      - 'llm_evaluation/run_faithfulness_eval.py'
      - 'llm_evaluation/pm_natural_language_interface.py'
      - '.github/workflows/llm-faithfulness.yml'

jobs:
  faithfulness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify bounded-interface authority tests
        run: python -m pytest -q tests/test_aaf_v2_arbitration.py
      - name: Verify API secret is configured
        run: |
          python - <<'PY'
          import os
          if not os.getenv('OPENAI_API_KEY'):
              raise SystemExit('OPENAI_API_KEY repository secret is not available to this workflow')
          print('OPENAI_API_KEY is configured (value not displayed).')
          PY
      - name: Run 100-prompt bounded LLM evaluation
        run: python llm_evaluation/run_faithfulness_eval.py
      - name: Upload frozen evaluation outputs
        uses: actions/upload-artifact@v4
        with:
          name: llm-faithfulness-gpt-5-6-luna
          path: paper_results/llm_faithfulness/generated/
          if-no-files-found: error
          retention-days: 90
