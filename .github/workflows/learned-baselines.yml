name: AAF Learned Baseline Reproduction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/run_learned_baselines.py'
      - 'experiments/learned_baseline_hrt_template_features.csv'
      - 'scenario_generator/**'
      - 'requirements.txt'

jobs:
  learned-baselines:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Run frozen learned baselines
        run: python experiments/run_learned_baselines.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aaf-learned-baseline-results
          path: results_learned_baselines
