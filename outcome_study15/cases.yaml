# Study 15 fresh test cases (frozen before calibration and before any Study 15 run). Three services: frontend (UF-*),
# productcatalogservice (UP-*) and currencyservice (UC-*), the last two reached through the storefront home page.
# Groups: C control; L low-risk release (L01, L02 stable image; L03, L04 an image with more HIGH/MEDIUM findings than
# stable and no extra critical CVE); R release-caused regression; P fault present before the release (rollback cannot fix
# it); S security vs cost; K critical CVE with other domains healthy; D cost only; X compound. Symbolic values filled by
# calibrate15.py under the fixed rules in PROTOCOL.md: perf_cpu PERF = the service's calibrated degradation level;
# image keys V1/V2 (vulnerable) and N (low-risk) per service. No case names a correct action.
loads: {low: 4, normal: 20}
cases:
  - {id: UF-C01, service: frontend, previous: [], current: [], replicas: 1, load: normal}
  - {id: UF-L01, service: frontend, previous: [], current: [feature], replicas: 1, load: normal}
  - {id: UF-L02, service: frontend, previous: [], current: [feature], replicas: 1, load: low}
