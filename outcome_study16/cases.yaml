# Study 16 fresh test cases on a second application, Weaveworks Sock Shop (frozen before calibration and before any
# Study 16 run). Two services: front-end (SF-*, Node.js) and catalogue (SC-*, Go, reached through GET /catalogue on the
# front-end). Same 19-case design per service as Study 15 (groups C, L, R, P, S, K, D, X). Symbolic values filled by
# calibrate16.py under the fixed rules in PROTOCOL.md: perf_cpu PERF; image keys SF1/SF2, SC1/SC2 (vulnerable) and
# NSF, NSC (low-risk). No case names a correct action.
loads: {low: 4, normal: 20}
