# Study 14 fresh test cases (frozen before any Study 14 run). Two services: frontend (QF-*) and productcatalogservice
# (QP-*, reached through the storefront). Groups: C control; L low-risk release (stable image: no critical CVE, HIGH/MEDIUM
# findings present); R release-caused regression; P fault present before the release (rollback cannot fix it); S security vs
# cost; K critical CVE with other domains healthy; D cost only; X compound. Vulnerable images: frontend E/F, productcatalog
# P1/P2 (selected by calibrate14.py). No case names a correct action.
