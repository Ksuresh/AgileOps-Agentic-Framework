    admissible_actions: ["Scale adjustment", "Review scaling policy"]
    repetitions: 3

  - id: HRT-04
    title: heldout_restart_burst_variant_a
    intervention: restart_loop
    target_service: front-end
    parameters: {count: 4, interval_seconds: 15}
    oracle_domains: [DevOps]
    admissible_actions: ["Rollback to stable deployment"]
    repetitions: 3

  - id: HRT-05
    title: heldout_restart_burst_variant_b
    intervention: restart_loop
