cases:
  - id: RT-01
    title: healthy_baseline
    intervention: none
    target_service: null
    oracle_domains: []
    admissible_actions: ["No action (observe)"]
    repetitions: 5

  - id: RT-02
    title: stop_catalogue_service
    intervention: stop_service
    target_service: catalogue
    oracle_domains: [SRE]
    admissible_actions: ["Mitigate and monitor"]
    repetitions: 5

  - id: RT-03
    title: stop_carts_service
    intervention: stop_service
    target_service: carts
    oracle_domains: [SRE]
    admissible_actions: ["Mitigate and monitor"]
    repetitions: 5

  - id: RT-04
    title: repeated_frontend_restart
    intervention: restart_loop
    target_service: front-end
    parameters: {count: 5, interval_seconds: 5}
    oracle_domains: [DevOps, SRE]
    admissible_actions: ["Rollback to stable deployment", "Mitigate and monitor"]
    repetitions: 5

  - id: RT-05
    title: invalid_image_tag
    intervention: invalid_image
    target_service: front-end
    oracle_domains: [DevOps]
    admissible_actions: ["Block release and fix pipeline", "Rollback to stable deployment"]
    repetitions: 5

  - id: RT-06
    title: invalid_configuration
    intervention: invalid_env
    target_service: front-end
    oracle_domains: [DevOps]
    admissible_actions: ["Rollback to stable deployment", "Block release and fix pipeline"]
    repetitions: 5

  - id: RT-07
    title: cpu_constraint
    intervention: cpu_limit
    target_service: front-end
    parameters: {cpus: 0.15}
    oracle_domains: [SRE]
    admissible_actions: ["Mitigate and monitor", "Scale adjustment"]
    repetitions: 5

  - id: RT-08
    title: memory_constraint
    intervention: memory_limit
    target_service: front-end
    parameters: {memory: 128m}
    oracle_domains: [SRE]
    admissible_actions: ["Mitigate and monitor", "Scale adjustment"]
    repetitions: 5

  - id: RT-09
    title: excessive_scale_out
    intervention: scale_service
    target_service: front-end
    parameters: {replicas: 8}
    oracle_domains: [FinOps]
    admissible_actions: ["Scale adjustment", "Review scaling policy"]
    repetitions: 5

  - id: RT-10
    title: overprovisioning_control
    intervention: scale_service
    target_service: front-end
    parameters: {replicas: 12}
    oracle_domains: [FinOps]
    admissible_actions: ["Scale adjustment", "Review scaling policy"]
    repetitions: 5

  - id: RT-11
    title: high_request_load
    intervention: load_test
    target_service: front-end
    parameters: {duration_seconds: 120, concurrency: 50}
    oracle_domains: [SRE]
    admissible_actions: ["Mitigate and monitor", "Scale adjustment"]
    repetitions: 5

  - id: RT-12
    title: high_load_plus_scale_out
    intervention: compound
    target_service: front-end
    parameters: {replicas: 8, duration_seconds: 120, concurrency: 50}
    oracle_domains: [SRE, FinOps]
    admissible_actions: ["Scale adjustment", "Mitigate and monitor"]
    repetitions: 5

  - id: RT-13
    title: deployment_incident
    intervention: compound
    target_service: front-end
    parameters: {invalid_image: true, load_after_failure: true}
    oracle_domains: [DevOps, SRE]
    admissible_actions: ["Rollback to stable deployment"]
    repetitions: 5

  - id: RT-14
    title: security_scan_failure
    intervention: security_gate_failure
    target_service: front-end
    oracle_domains: [DevSecOps]
    admissible_actions: ["Patch or block release"]
    repetitions: 5

  - id: RT-15
    title: iam_policy_drift
    intervention: policy_drift
    target_service: front-end
    oracle_domains: [DevSecOps]
    admissible_actions: ["Patch or block release"]
    repetitions: 5

  - id: RT-16
    title: security_only_control
    intervention: security_gate_failure
    target_service: catalogue
    oracle_domains: [DevSecOps]
    admissible_actions: ["Patch or block release"]
    repetitions: 5

  - id: RT-17
    title: security_plus_latency
    intervention: compound
    target_service: front-end
    parameters: {security_gate_failure: true, cpu_limit: 0.15}
    oracle_domains: [DevSecOps, SRE]
    admissible_actions: ["Patch or block release", "Mitigate and monitor"]
    repetitions: 5

  - id: RT-18
    title: deployment_plus_security
    intervention: compound
    target_service: front-end
    parameters: {invalid_image: true, security_gate_failure: true}
    oracle_domains: [DevOps, DevSecOps]
    admissible_actions: ["Patch or block release", "Block release and fix pipeline"]
    repetitions: 5

  - id: RT-19
    title: missing_evidence_variant
    intervention: evidence_suppression
    parent_case: RT-13
    parameters: {suppress_source: service_logs}
    oracle_domains: [DevOps, SRE]
    admissible_actions: ["Rollback to stable deployment"]
    repetitions: 5

  - id: RT-20
    title: noisy_partial_evidence_variant
    intervention: evidence_noise
    parent_case: RT-12
    parameters: {drop_fraction: 0.25, numeric_jitter_pct: 0.10}
    oracle_domains: [SRE, FinOps]
    admissible_actions: ["Scale adjustment", "Mitigate and monitor"]
    repetitions: 5

  # Frozen after the cross-domain interaction policy commit 0141740.
  # These are confirmatory runtime cases and must not be used to tune that policy.
  - id: HRT-01
    title: heldout_healthy_control
