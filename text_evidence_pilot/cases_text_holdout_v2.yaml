- id: HO-R2
  tier: holdout
  category: ratio
  focus: total stated before the failures (order the v1 ratio check cannot verify)
  scope: {service: notif-api}
  structured:
    sre: {p95_latency_ms: 300, availability_pct: 99.6, error_rate_pct: null, _evidence: {error_rate_pct: {status: missing}}}
  documents:
    - {id: DOC-1, kind: log_summary, text: "notif-api: out of 400 requests in the window, 36 failed."}
  truth:
    sre.error_rate_pct: {value: 9, quote: "out of 400 requests in the window, 36 failed", method: ratio_percent}
  decoy: {}
  validator_expected: reject_v1
  notes: "ratio_percent takes the first two numbers in order (400, 36), so a correct 9% cannot be verified; limitation probe."

