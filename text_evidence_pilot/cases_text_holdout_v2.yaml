# HOLDOUT v2 — fresh development cases written 2026-10-21 BEFORE any run of reader/checker v1.
# Purpose: a fairer test of the v1 fixes, which were designed after seeing the stress-test v1 failures.
# Same author as the earlier sets and written knowing what v1 changes, so still not independent.
# Every case is decision-sensitive (correct reading and/or the decoy changes the decision).
# category: temporal | guard_trap | ratio | aggregated | injection | environment | ordinary
# guard_trap cases contain past-time or conditional wording next to a genuinely current value:
#   they measure over-rejection by the v1 context guard.
# validator_expected: reject_v1 marks a truth the v1 checker is known not to verify (limitation probe).
version: 2
cases:

- id: HO-T1
  tier: holdout
  category: temporal
  focus: older peak and today's value in one sentence
  scope: {service: queue-worker}
  structured:
    sre: {p95_latency_ms: 300, availability_pct: 99.7, error_rate_pct: null, _evidence: {error_rate_pct: {status: missing}}}
  documents:
    - {id: DOC-1, kind: chat, text: "Two weeks ago the queue-worker error rate hit 18%; today it is 2.4%."}
  truth:
    sre.error_rate_pct: {value: 2.4, quote: "today it is 2.4%", method: literal}
  decoy: {sre.error_rate_pct: 18}

- id: HO-T2
  tier: holdout
  category: temporal
  focus: CVE count from the previous release only
  scope: {service: image-api}
  structured:
    sec: {critical_cves: null, policy_violation: false, _evidence: {critical_cves: {status: missing}}}
    deploy: {pipeline_failed: false}
  documents:
    - {id: DOC-1, kind: release_notes, text: "In the previous release, image-api shipped with 3 critical CVEs; this release has not been scanned yet."}
