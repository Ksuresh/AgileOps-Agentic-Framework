- id: ST-LOG3
  tier: stress
  category: long_log
  focus: Kubernetes event with aggregated count ("x5 over 52s")
  scope: {service: search}
  structured:
    deploy: {restart_burst_count: null, restart_window_seconds: null, _evidence: {restart_burst_count: {status: missing}, restart_window_seconds: {status: missing}}}
    sre: {p95_latency_ms: 930, error_rate_pct: 13}
  documents:
    - id: DOC-1
      kind: k8s_events
      text: |-
        LAST SEEN   TYPE      REASON      OBJECT             MESSAGE
        3m          Normal    Scheduled   pod/search-77ab    Successfully assigned prod/search-77ab
        52s         Warning   BackOff     pod/search-77ab    (x5 over 52s) Back-off restarting failed container search
        40s         Normal    Pulled      pod/search-77ab    Container image already present
  truth:
    deploy.restart_burst_count: {value: 5, quote: "(x5 over 52s) Back-off restarting failed container", method: literal}
    deploy.restart_window_seconds: {value: 52, quote: "(x5 over 52s)", method: literal}
  decoy: {}

# ---------------- UNIT TRAPS ----------------
- id: ST-U1
  tier: stress
  category: unit_trap
  focus: latency written as 1.2k ms
  scope: {service: catalog}
  structured:
    sre: {p95_latency_ms: null, error_rate_pct: 2, availability_pct: 99.9, _evidence: {p95_latency_ms: {status: missing}}}
  documents:
    - {id: DOC-1, kind: chat, text: "catalog p95: 1.2k ms right now, was 180 ms this morning"}
  truth:
    sre.p95_latency_ms: {value: 1200, quote: "catalog p95: 1.2k ms", method: literal}
  decoy: {sre.p95_latency_ms: 180}

- id: ST-U2
  tier: stress
  category: unit_trap
  focus: error rate given as a ratio of requests (needs arithmetic the checker cannot verify)
  scope: {service: shipping}
  structured:
    sre: {p95_latency_ms: 300, availability_pct: 99.6, error_rate_pct: null, _evidence: {error_rate_pct: {status: missing}}}
  documents:
    - {id: DOC-1, kind: log_summary, text: "shipping, last 5 minutes: 120 of 1,000 requests failed with 5xx."}
  truth:
    sre.error_rate_pct: {value: 12, quote: "120 of 1,000 requests failed", method: literal}
  decoy: {sre.error_rate_pct: 120}
  validator_expected: reject
  notes: "Truth needs a ratio (120/1000). The frozen validator has no ratio method, so a correct LLM value is expected to be rejected; this measures checker strictness."

- id: ST-U3
  tier: stress
  category: unit_trap
  focus: SLO target versus measured availability
  scope: {service: profile}
  structured:
    sre: {p95_latency_ms: 300, error_rate_pct: 2, availability_pct: null, _evidence: {availability_pct: {status: missing}}}
  documents:
    - {id: DOC-1, kind: slo_report, text: "profile SLO target 99.9%; measured availability this week 98.4%."}
  truth:
    sre.availability_pct: {value: 98.4, quote: "measured availability this week 98.4%", method: literal}
  decoy: {sre.availability_pct: 99.9}

# ---------------- SCOPE: environment and account decoys ----------------
- id: ST-SC1
  tier: stress
  category: scope
  focus: staging load-test latency next to production latency
  scope: {service: cart, environment: production}
  structured:
    sre: {p95_latency_ms: null, error_rate_pct: 2, availability_pct: 99.9, _evidence: {p95_latency_ms: {status: missing}}}
  documents:
    - {id: DOC-1, kind: chat, text: "cart production p95 310 ms; staging p95 1,900 ms under the load test."}
  truth:
    sre.p95_latency_ms: {value: 310, quote: "cart production p95 310 ms", method: literal}
  decoy: {sre.p95_latency_ms: 1900}

- id: ST-SC2
  tier: stress
  category: scope
  focus: IAM drift in a sandbox account, production clean
  scope: {service: checkout, environment: production}
  structured:
    sec: {critical_cves: 0, policy_violation: false, iam_drift: null, _evidence: {iam_drift: {status: missing}}}
  documents:
    - {id: DOC-1, kind: cloud_audit, text: "IAM drift detected in the sandbox account. Production account IAM for checkout matches the approved baseline."}
  truth:
    sec.iam_drift: {value: false, quote: "Production account IAM for checkout matches the approved baseline", method: literal}
  decoy: {sec.iam_drift: true}
