# DEVELOPMENT PILOT ONLY — not confirmatory, never pooled with confirmatory data.
# Authored 2026-10-21 after regex_reader.py was written; regex_reader.py is not edited after authoring.
#
# Each case: structured evidence (fields only present in text are null + status missing),
# chronologically ordered text documents, the incident scope, and evaluator-only ground truth.
# truth.<field>.quote is an exact substring of one document; method is how the value follows from it:
#   literal            value is stated in the quote (digits, number words, or "no/none" for 0)
#   count_lines        value = number of lines in the quoted log block
#   time_span_seconds  value = seconds between the first and last HH:MM:SS timestamps in the quote
# Evaluator-only keys (never shown to a reader): truth, tier, focus, notes.
version: 0
cases:

# ---------------- EASY: explicit values, standard wording ----------------
- id: TX-E01
  tier: easy
  focus: restart burst stated in incident note
  scope: {service: checkout-api}
  structured:
    deploy: {restart_burst_count: null, restart_window_seconds: null, _evidence: {restart_burst_count: {status: missing}, restart_window_seconds: {status: missing}}}
    sre: {p95_latency_ms: 920, error_rate_pct: 13, availability_pct: 98.1}
  documents:
    - {id: DOC-1, kind: incident_note, text: "Post-deploy of checkout-api v2.4.1: 5 pod restarts within 50 seconds, readiness probe failing."}
  truth:
    deploy.restart_burst_count: {value: 5, quote: "5 pod restarts", method: literal}
    deploy.restart_window_seconds: {value: 50, quote: "within 50 seconds", method: literal}

